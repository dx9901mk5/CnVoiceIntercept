name: Build and Release Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build Release APK
        run: gradle assembleRelease
      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk CnVoiceIntercept-v1.0.0.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CnVoiceIntercept-APK
          path: CnVoiceIntercept-v1.0.0.apk
      - name: Publish GitHub Release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: if gh release view v1.0.0 >/dev/null 2>&1; then gh release upload v1.0.0 CnVoiceIntercept-v1.0.0.apk --clobber; else gh release create v1.0.0 CnVoiceIntercept-v1.0.0.apk --title "CnVoiceIntercept v1.0.0" --notes-file RELEASE_NOTES.md; fi
